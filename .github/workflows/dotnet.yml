name: dotnet

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "Windows-OSC-Volume-Control.csproj"

      - name: Build
        run: dotnet build "Windows-OSC-Volume-Control.csproj" --configuration Release --no-restore

      - name: Test
        run: dotnet test "tests/WindowsOscVolumeControl.Tests/WindowsOscVolumeControl.Tests.csproj" --configuration Release --no-build

      - name: Upload release zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: bin/Release/Windows-OSC-Volume-Control-Release.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          release_tag="sha-${COMMIT_SHA}"
          release_title="${COMMIT_SUBJECT%%$'\n'*}"
          gh release create "$release_tag" \
            "Windows-OSC-Volume-Control-Release.zip" \
            --target "$COMMIT_SHA" \
            --title "$release_title" \
            --generate-notes \
            --latest
